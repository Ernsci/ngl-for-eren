<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>send me a message</title>
  <link rel="stylesheet" href="/style.css">
</head>
<body>
  <main class="hero">
    <div class="card send-card">
      <div class="profile-header">
        <div class="avatar">
          <img id="avatar" alt="">
          <span class="avatar-letter" id="avatar-letter">?</span>
        </div>
        <div class="profile-text">
          <h2 id="profile-name">someone</h2>
          <p id="profile-bio" class="bio"></p>
        </div>
      </div>

      <p class="prompt">Send me a message</p>

      <form id="send-form" class="create-form">
        <textarea id="message" placeholder="type your message..." maxlength="500" required></textarea>
        <button type="submit" class="btn-gradient">Send</button>
      </form>
      <p id="send-error" class="error hidden"></p>

      <div id="typing" class="typing hidden">
        <span></span><span></span><span></span>
      </div>
      <div id="sent" class="sent hidden">
        <div class="check">&#10003;</div>
        <p>Message sent!</p>
      </div>
    </div>
  </main>
  <script src="/config.js"></script>
  <script src="/app.js"></script>
</body>
</html>
