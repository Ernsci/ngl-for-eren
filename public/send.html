<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="theme-color" content="#0c0c14">
  <title>send me a message</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="app-bar">
    <button class="back-btn" id="back-btn" type="button" aria-label="Back">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 18l-6-6 6-6"/></svg>
    </button>
    <span class="app-bar-title">Send a message</span>
    <span class="app-bar-spacer"></span>
  </header>

  <main class="page">
    <div class="card send-card">
      <div class="profile-header">
        <div class="avatar">
          <img id="avatar" alt="">
          <span class="avatar-letter" id="avatar-letter">?</span>
        </div>
        <div class="profile-text">
          <h2 id="profile-name">someone</h2>
          <p id="profile-bio" class="bio"></p>
        </div>
      </div>

      <p class="prompt">Send me a message</p>

      <form id="send-form">
        <div class="field">
          <textarea id="message" placeholder="type your message..." maxlength="500" required></textarea>
        </div>
        <button type="submit" class="btn btn-gradient">Send</button>
        <p id="send-error" class="error hidden"></p>
      </form>

      <div id="typing" class="typing hidden">
        <span></span><span></span><span></span>
      </div>
      <div id="sent" class="sent hidden">
        <div class="check">&#10003;</div>
        <p>Message sent!</p>
      </div>
    </div>
  </main>

  <script src="config.js"></script>
  <script src="app.js"></script>
</body>
</html>
