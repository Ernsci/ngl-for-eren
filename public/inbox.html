<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="theme-color" content="#faf9ff">
  <title>inbox — your messages</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="app-bar">
    <a class="back-btn" href="index.html" aria-label="Back">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 18l-6-6 6-6"/></svg>
    </a>
    <span class="app-bar-title">Inbox</span>
    <span class="app-bar-spacer"></span>
  </header>

  <main class="page">
    <div class="card inbox-card">
      <div class="inbox-head">
        <h2 class="send-title">Your messages</h2>
        <span id="unread-badge" class="unread-badge hidden"></span>
      </div>
      <p class="tagline">Paste your admin key to view messages.</p>

      <form id="inbox-form">
        <div class="field">
          <input id="admin-key" type="password" placeholder="admin key" autocomplete="off" required>
        </div>
        <button type="submit" class="btn btn-gradient">View messages</button>
        <p id="inbox-error" class="error hidden"></p>
      </form>

      <div id="notification-banner" class="notification-banner hidden">
        <span class="notification-text"></span>
        <button id="dismiss-banner" class="btn-ghost" type="button">Dismiss</button>
      </div>

      <div id="messages" class="messages hidden"></div>

      <div class="inbox-links hidden" id="inbox-links">
        <a class="btn btn-ghost link-btn" href="profile.html">Edit my profile</a>
        <a class="btn btn-ghost link-btn" href="index.html" id="logout-link">Log out</a>
      </div>
    </div>
  </main>

  <script src="config.js"></script>
  <script src="app.js"></script>
</body>
</html>
