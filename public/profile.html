<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="theme-color" content="#faf9ff">
  <title>edit profile</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="app-bar">
    <a class="back-btn" href="inbox.html" aria-label="Back">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 18l-6-6 6-6"/></svg>
    </a>
    <span class="app-bar-title">Edit profile</span>
    <span class="app-bar-spacer"></span>
  </header>

  <main class="page">
    <div class="card profile-card">
      <div class="avatar-preview">
        <img id="avatar-preview" alt="">
        <span class="avatar-placeholder" id="avatar-placeholder">?</span>
      </div>
      <h2 class="send-title">Your profile</h2>
      <p class="tagline">Make it look like you.</p>

      <p class="account-email" id="account-email"></p>

      <form id="profile-form">
        <div class="field">
          <label class="field-label" for="display-name">Display name</label>
          <input id="display-name" type="text" maxlength="30" placeholder="your name" autocomplete="off">
        </div>
        <div class="field">
          <label class="field-label" for="avatar-url">Avatar image URL</label>
          <input id="avatar-url" type="url" maxlength="500" placeholder="https://..." autocomplete="off">
        </div>
        <div class="field">
          <label class="field-label" for="bio">Bio</label>
          <textarea id="bio" maxlength="160" placeholder="a sentence about you"></textarea>
        </div>
        <button type="submit" class="btn btn-gradient">Save profile</button>
        <p id="profile-error" class="error hidden"></p>
      </form>

      <a class="btn btn-ghost link-btn" href="inbox.html">Open my inbox</a>
    </div>
  </main>

  <script src="config.js"></script>
  <script src="app.js"></script>
</body>
</html>
