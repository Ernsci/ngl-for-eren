<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="theme-color" content="#07070d">
  <title>log in — confess</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="app-bar">
    <a class="back-btn" href="index.html" aria-label="Back">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 18l-6-6 6-6"/></svg>
    </a>
    <span class="app-bar-title">Log in</span>
    <span class="app-bar-spacer"></span>
  </header>

  <main class="page">
    <section class="hero-section">
      <h1 class="hero-logo">confess<span>.</span></h1>
      <p class="hero-tagline">Welcome back. Log in to see your messages.</p>
    </section>

    <div class="card">
      <form id="login-form">
        <div class="field">
          <label class="field-label" for="email">Email</label>
          <input id="email" type="email" placeholder="you@example.com" autocomplete="email" required>
        </div>
        <div class="field">
          <label class="field-label" for="password">Password</label>
          <input id="password" type="password" placeholder="your password" autocomplete="current-password" required>
        </div>
        <button type="submit" class="btn btn-gradient">Log in</button>
        <p id="login-error" class="error hidden"></p>
      </form>

      <p class="switch-link">No account? <a href="index.html">Create one</a></p>
    </div>
  </main>

  <script src="config.js"></script>
  <script src="app.js"></script>
</body>
</html>
