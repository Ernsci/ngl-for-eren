<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>log in — confess</title>
  <link rel="stylesheet" href="/style.css">
</head>
<body>
  <main class="hero">
    <div class="card">
      <h1 class="logo">confess<span>.</span></h1>
      <p class="tagline">Welcome back. Log in to see your messages.</p>

      <form id="login-form" class="create-form">
        <label class="field-label" for="email">Email</label>
        <input id="email" name="email" type="email" placeholder="you@example.com" autocomplete="email" required>

        <label class="field-label" for="password">Password</label>
        <input id="password" name="password" type="password" placeholder="your password" autocomplete="current-password" required>

        <button type="submit" class="btn-gradient">Log in</button>
      </form>
      <p id="login-error" class="error hidden"></p>

      <p class="switch-link">No account? <a href="/">Create one</a></p>
    </div>
  </main>
  <script src="/config.js"></script>
  <script src="/app.js"></script>
</body>
</html>
